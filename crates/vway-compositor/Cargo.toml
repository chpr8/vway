[package]
name = "vway-compositor"
description = "Headless Smithay compositor and session supervisor behind vway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
vway-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
smithay = { version = "0.7.0", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "renderer_pixman",
    "renderer_gl",
] }
calloop = { version = "0.14", features = ["signals"] }
pixman = "0.2.1"
png = "0.17"
